name: gpu-ehl
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - h5py>=3.8
  - matplotlib>=3.7
  - tqdm>=4.65
  - pytest>=7.0
  - pytest-cov>=4.0
  - pip:
      # Install the JAX variant matching your hardware:
      # CPU-only: jax[cpu]
      # NVIDIA GPU: jax[cuda]
      - jax[cuda]>=0.4
      - pymupdf>=1.28
      - plotly>=5.0
